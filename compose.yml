x-uid_gid: &uid_gid
  USER_ID: "${USER_ID:-1000}"
  GROUP_ID: "${GROUP_ID:-1000}"

volumes:
  db:
    name: "${COMPOSE_PROJECT_NAME}_db"

  phpmyadmin:
    name: "${COMPOSE_PROJECT_NAME}_phpmyadmin"

  ssl:
    name: "${COMPOSE_PROJECT_NAME}_ssl"

  acme:
    name: "${COMPOSE_PROJECT_NAME}_acme"

services:
  nginx:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:nginx"
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
      args:
        NGINX_VERSION: stable
    working_dir: /var/www/html
    environment:
      <<: *uid_gid
      APP_DEBUG: "${APP_DEBUG:-false}"
      NGINX_HOST: "${NGINX_HOST:-_}"
      NGINX_PORT: "${NGINX_PORT:-80}"
      NGINX_SSL_PORT: "${NGINX_SSL_PORT:-443}"
      PHPMYADMIN_ENABLED: "${PHPMYADMIN_ENABLED:-false}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      ACME_ENABLED: "${ACME_ENABLED:-false}"
    ports:
      - "${NGINX_PORT:-80}:${NGINX_PORT:-80}"
      - "${NGINX_SSL_PORT:-443}:${NGINX_SSL_PORT:-443}"
    volumes:
      - phpmyadmin:/var/www/phpmyadmin:ro
      - "${SSL_DIR:-ssl}:/etc/nginx/ssl:delegated"
      - acme:/etc/acme:delegated
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      start_period: 9s
      interval: 30s
      timeout: 5s
      retries: 3
    develop:
      watch:
        - action: sync
          initial_sync: true
          path: .
          target: /var/www/html
          ignore:
            - node_modules/
            - vendor/
        - action: sync+restart
          initial_sync: true
          path: .
          target: /var/www/html
          include:
            - nginx.conf

  php:
    pull_policy: never
    image: ${COMPOSE_PROJECT_NAME}:php
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
        NODE_VERSION: ${NODE_VERSION:-current}
        PHP_VERSION: ${PHP_VERSION}
        PHP_EXTENSIONS: ${PHP_EXTENSIONS}
        PHP_DEV_EXTENSIONS: ${PHP_DEV_EXTENSIONS}
    working_dir: /var/www
    environment:
      <<: *uid_gid
      APP_ENV: ${APP_ENV:-production}
    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh" ]
      start_period: 3s
      interval: 30s
      timeout: 5s
      retries: 3
    develop:
      watch:
        - action: sync
          initial_sync: true
          path: .
          target: /var/www
          ignore:
            - node_modules
            - vendor

  db:
    pull_policy: never
    image: ${COMPOSE_PROJECT_NAME}:${DB_CONNECTION:-mysql}
    restart: unless-stopped
    profiles:
      - ${DB_DISABLED:+db}
    build:
      context: .
      dockerfile: .docker/db/${DB_CONNECTION:-mysql}/Dockerfile
      args:
        DB_VERSION: ${DB_VERSION:-latest}
    environment:
      <<: *uid_gid
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_DATABASE: ${DB_DATABASE:-laravel}
    volumes:
      - ${DB_DATA_DIR:-db}:/var/db
    develop:
      watch:
        - action: sync+restart
          initial_sync: true
          path: .
          target: /var/www/
        - action: sync
          path: .
          include:
            - .env
          target: /var/www/html

  phpmyadmin:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:phpmyadmin"
    container_name: "${COMPOSE_PROJECT_NAME}-phpmyadmin"
    restart: unless-stopped
    build:
      context: .docker
      dockerfile: phpmyadmin/Dockerfile
      args:
        <<: *uid_gid
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      PHPMYADMIN_ENABLED: ${PHPMYADMIN_ENABLED:-true}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      PMA_HOST: db
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./:/var/www/app:delegated
      - phpmyadmin:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock:ro

  cron:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:cron"
    container_name: "${COMPOSE_PROJECT_NAME}-cron"
    restart: unless-stopped
    working_dir: /var/www/html
    build:
      context: .docker
      dockerfile: cron/Dockerfile
      additional_contexts:
        php_image: "service:php"
    environment:
      CRON_ENABLED: ${CRON_ENABLED:-true}
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      start_period: 1.5m
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./:/var/www/html:delegated
      - /var/run/docker.sock:/var/run/docker.sock:ro

  supervisor:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:supervisor"
    container_name: "${COMPOSE_PROJECT_NAME}-supervisor"
    restart: unless-stopped
    working_dir: /var/www/html
    build:
      context: .docker
      dockerfile: supervisor/Dockerfile
      additional_contexts:
        php_image: "service:php"
      args:
        COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    environment:
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      start_period: 3s
      interval: 30s
      timeout: 2s
      retries: 3
    volumes:
      - ./:/var/www/html:delegated
      - /var/run/docker.sock:/var/run/docker.sock:ro

  acme:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:acme"
    container_name: "${COMPOSE_PROJECT_NAME}-acme"
    restart: unless-stopped
    build:
      context: .docker/acme
      args:
        <<: *uid_gid
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      ACME_ENABLED: ${ACME_ENABLED:-false}
      APP_DEBUG: ${APP_DEBUG:-true}
      ACME_EAB_KID: ${ACME_EAB_KID}
      ACME_EAB_HMAC_KEY: ${ACME_EAB_HMAC_KEY}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-letsencrypt}
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./:/var/www/html:delegated
      - acme:/acme.sh
      - ${SSL_DIR:-ssl}:/ssl:delegated
      - /var/run/docker.sock:/var/run/docker.sock:ro

  node:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:node"
    container_name: "${COMPOSE_PROJECT_NAME}-node"
    working_dir: /var/www/html
    build:
      context: .docker
      dockerfile: node/Dockerfile
      args:
        <<: *uid_gid
        NODE_VERSION: ${NODE_VERSION:-current}
    ports:
      - ${VITE_PORT:-5173}:${VITE_PORT:-5173}
    volumes:
      - ./:/var/www/html:delegated

  composer:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:composer"
    container_name: "${COMPOSE_PROJECT_NAME}-composer"
    working_dir: /var/www/html
    build:
      context: .docker
      dockerfile: composer/Dockerfile
      additional_contexts:
        php_image: "service:php"
    volumes:
      - ./:/var/www/html:delegated

  artisan:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:artisan"
    container_name: "${COMPOSE_PROJECT_NAME}-artisan"
    working_dir: /var/www/html
    build:
      context: .docker
      dockerfile: artisan/Dockerfile
      additional_contexts:
        php_image: "service:php"
    volumes:
      - ./:/var/www/html:delegated

  update:
    pull_policy: never
    image: "${COMPOSE_PROJECT_NAME}:update"
    container_name: "${COMPOSE_PROJECT_NAME}-update"
    working_dir: /app
    build:
      args:
        <<: *uid_gid
      context: .docker/update
    profiles:
      - tools
    volumes:
      - ./:/app:delegated
      - /var/run/docker.sock:/var/run/docker.sock:ro
